<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings | 3D Neon</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        
        body { 
            background-color: var(--bg-color, #050914); 
            color: var(--text-color, #e0f7fa); 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
            perspective: 1200px; 
            transition: 0.3s;
        }

        /* ----- 3D NEON GRID BACKGROUND ----- */
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 200%; height: 200%;
            background-image: linear-gradient(rgba(0, 243, 255, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 243, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px; 
            transform: rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: moveGrid 15s linear infinite; 
            z-index: 0;
        }
        @keyframes moveGrid { 0% { transform: rotateX(60deg) translateY(0) translateZ(-200px); } 100% { transform: rotateX(60deg) translateY(40px) translateZ(-200px); } }

        /* ----- SIDEBAR (Glassmorphism Neon) ----- */
        .sidebar { 
            width: 260px; background: var(--card-bg, rgba(0, 15, 25, 0.8)); height: 100vh; display: flex; flex-direction: column; 
            justify-content: space-between; border-right: 2px solid #00f3ff; box-shadow: 5px 0 20px rgba(0, 243, 255, 0.2);
            backdrop-filter: blur(10px); z-index: 10; padding: 20px 0; transition: 0.3s;
        }
        .brand { text-align: center; color: #00f3ff; margin-bottom: 30px; font-size: 18px; text-shadow: 0 0 10px #00f3ff; text-transform: uppercase; letter-spacing: 2px; }
        .nav-item { text-decoration: none; color: #a0d8ef; padding: 15px 25px; margin: 5px 15px; border-radius: 8px; font-weight: bold; transition: 0.3s; text-transform: uppercase; border: 1px solid transparent; font-size: 14px;}
        .nav-item:hover { background: rgba(0, 243, 255, 0.1); color: #fff; border-color: #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.4) inset; transform: translateX(5px); }
        .nav-item.active { background: rgba(0, 243, 255, 0.2); color: #00f3ff; border: 1px solid #00f3ff; box-shadow: 0 0 15px #00f3ff inset; }
        .logout-btn { margin: 15px; background: transparent; color: #ff003c; border: 1px solid #ff003c; text-align: center; padding: 15px; border-radius: 8px; font-weight: bold; text-decoration: none; text-transform: uppercase; box-shadow: 0 0 10px #ff003c inset; transition: 0.3s; }
        .logout-btn:hover { background: #ff003c; color: #000; box-shadow: 0 0 20px #ff003c, 0 0 40px #ff003c inset; }

        /* ----- MAIN CONTENT ----- */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; z-index: 10; }
        
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid rgba(0,243,255,0.3); padding-bottom: 15px; }
        .header-title { font-size: 24px; color: #fff; text-shadow: 0 0 10px #00f3ff; margin: 0; text-transform: uppercase; letter-spacing: 2px;}
        
        .btn-back { padding: 10px 20px; background: transparent; color: #ff003c; border: 2px solid #ff003c; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 14px; text-transform: uppercase; box-shadow: 0 0 10px #ff003c inset; transition: 0.4s; }
        .btn-back:hover { background: #ff003c; color: #000; box-shadow: 0 0 20px #ff003c, 0 0 40px #ff003c inset; }

        /* ----- 3D NEON CARDS ----- */
        .neon-card { 
            background: var(--card-bg, rgba(0, 24, 40, 0.6)); padding: 30px; border-radius: 15px; 
            border: 1px solid #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.2), inset 0 0 15px rgba(0, 243, 255, 0.1);
            max-width: 650px; margin-bottom: 30px; backdrop-filter: blur(8px); 
            transform-style: preserve-3d; transition: transform 0.1s ease-out, box-shadow 0.3s ease; 
        }
        .neon-card h2 { margin-top: 0; color: #00f3ff; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 5px rgba(0,243,255,0.5); transform: translateZ(20px);}

        /* ----- INPUTS & LABELS ----- */
        label { display: block; color: #00f3ff; font-size: 13px; margin: 15px 0 5px; font-weight: bold; text-transform: uppercase; transform: translateZ(10px);}
        input { width: 100%; padding: 12px; border-radius: 5px; border: 1px solid rgba(0, 243, 255, 0.4); background: rgba(0, 243, 255, 0.05); color: #fff; box-sizing: border-box; outline: none; font-size: 15px; font-family: inherit; transition: 0.3s; transform: translateZ(15px);}
        input:focus { border-color: #00f3ff; box-shadow: 0 0 10px rgba(0, 243, 255, 0.5); }
        input[readonly] { background: rgba(255, 255, 255, 0.05); color: #a0d8ef; border-color: rgba(0, 243, 255, 0.2); cursor: not-allowed; text-shadow: none; }

        /* ----- BUTTONS ----- */
        .btn-3d { padding: 12px; font-size: 15px; font-weight: bold; background: transparent; border-radius: 5px; cursor: pointer; width: 100%; transition: 0.4s; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; font-family: inherit; transform: translateZ(25px);}
        
        .btn-green { color: #00ff00; border: 2px solid #00ff00; box-shadow: 0 0 10px #00ff00 inset; }
        .btn-green:hover { background: #00ff00; color: #000; box-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00 inset; }
        
        .btn-otp { color: #ffae00; border: 2px solid #ffae00; box-shadow: 0 0 10px #ffae00 inset; width: auto; white-space: nowrap; margin-top:0; padding: 10px 20px;}
        .btn-otp:hover { background: #ffae00; color: #000; box-shadow: 0 0 20px #ffae00, 0 0 40px #ffae00 inset; }

        .btn-verify { color: #00f3ff; border: 2px solid #00f3ff; box-shadow: 0 0 10px #00f3ff inset; width: auto; margin-top:0; padding: 10px 20px;}
        .btn-verify:hover { background: #00f3ff; color: #000; box-shadow: 0 0 20px #00f3ff, 0 0 40px #00f3ff inset; }

        /* ----- THEME SWITCHER (Neon Style) ----- */
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; transform: translateZ(20px); }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 243, 255, 0.1); border: 1px solid #00f3ff; transition: .4s; border-radius: 34px; box-shadow: 0 0 5px #00f3ff inset;}
        .slider:before { position: absolute; content: "🌙"; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: #00f3ff; color: #000; transition: .4s; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; box-shadow: 0 0 10px #00f3ff;}
        input:checked + .slider { background-color: rgba(255, 255, 255, 0.2); border-color: #fff; box-shadow: 0 0 5px #fff inset;}
        input:checked + .slider:before { transform: translateX(22px); content: "☀️"; background-color: #fff; box-shadow: 0 0 10px #fff;}

        /* ----- TABS ----- */
        .tab-btn { background: transparent; border: none; color: #a0d8ef; font-size: 15px; font-weight: bold; cursor: pointer; margin-right: 20px; padding-bottom: 8px; text-transform: uppercase; transition: 0.3s; font-family: inherit; transform: translateZ(10px);}
        .tab-btn.active { color: #00f3ff; border-bottom: 2px solid #00f3ff; text-shadow: 0 0 5px #00f3ff; }
        .tab-btn:hover { color: #fff; }
        .tab-content { display: none; transform: translateZ(15px); }
        .tab-content.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Light Mode Variables (Kept for functionality) */
        body.light-mode { --bg-color: #0a1128; --text-color: #e0f7fa; --card-bg: rgba(10, 17, 40, 0.8); --border-color: #00f3ff; }
    </style>
</head>
<body>
    <script>if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');</script>

    <div class="bg-grid"></div>

    <div class="sidebar">
        <div>
            <div class="brand">👩‍🏫 Teacher Portal</div>
            <a href="/teacher/dashboard" class="nav-item">Dashboard</a>
            <a href="/teacher/profile" class="nav-item">Personal Info</a>
            <a href="/teacher/settings" class="nav-item active">Settings</a>
        </div>
        <a href="/logout" class="logout-btn">Secure Logout</a>
    </div>

    <div class="main-content">
        <div class="header-section">
            <h1 class="header-title">⚙️ System Settings</h1>
            <a href="/teacher/dashboard" class="btn-back">🔙 Back to Dashboard</a>
        </div>

        <div class="neon-card tilt-element" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h2 style="margin:0;">Theme Preference</h2>
                <p style="margin: 5px 0 0; color: rgba(0,243,255,0.7); font-size:13px; transform: translateZ(10px);">Toggle system UI mode.</p>
            </div>
            <label class="switch">
                <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
                <span class="slider"></span>
            </label>
        </div>

        <div class="neon-card tilt-element">
            <h2>Security Protocols</h2>
            <div style="margin-bottom: 25px; border-bottom: 1px solid rgba(0,243,255,0.2);">
                <button class="tab-btn active" onclick="switchTab('change')">Change Password</button>
                <button class="tab-btn" onclick="switchTab('forgot')">Forgot Password (OTP)</button>
            </div>

            <div id="change" class="tab-content active">
                <form method="POST" action="/teacher/settings">
                    <input type="hidden" name="action" value="change_password">
                    <label>Current Password</label>
                    <input type="password" name="current_password" required>
                    <label>New Password</label>
                    <input type="password" name="new_password" required>
                    <label>Confirm New Password</label>
                    <input type="password" name="confirm_password" required>
                    <button type="submit" class="btn-3d btn-green">UPDATE PASSWORD</button>
                </form>
            </div>

            <div id="forgot" class="tab-content">
                <form method="POST" action="/teacher/settings" id="forgotForm">
                    <input type="hidden" name="action" value="forgot_password">
                    
                    <label>Registered Email</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="email" name="email" id="fEmail" value="{{ teacher.email }}" readonly>
                        <button type="button" class="btn-3d btn-otp" id="otpBtn" onclick="sendOTP()">GET OTP</button>
                    </div>

                    <label>Enter 6-Digit OTP</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="text" id="otp_input_forgot" name="otp" required>
                        <button type="button" class="btn-3d btn-verify" id="vBtn" onclick="verifyOTPBeforeReset()">VERIFY OTP</button>
                    </div>
                    
                    <label>New Password</label>
                    <input type="password" name="new_password" required>
                    <label>Confirm New Password</label>
                    <input type="password" name="confirm_password" required>
                    
                    <button type="submit" id="submitPassBtn" class="btn-3d btn-green" disabled style="opacity:0.4; cursor:not-allowed;">RESET PASSWORD</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        emailjs.init("K6cs_matxXu2begVg");

        // 3D Tilt Effect for Cards
        document.querySelectorAll('.tilt-element').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                let rect = card.getBoundingClientRect();
                let x = e.clientX - rect.left;
                let y = e.clientY - rect.top;
                let xAxis = (rect.width / 2 - x) / 40;
                let yAxis = (rect.height / 2 - y) / 40;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = `rotateY(0deg) rotateX(0deg)`;
                card.style.transition = `transform 0.5s ease`;
            });
            card.addEventListener('mouseenter', () => {
                card.style.transition = `none`;
            });
        });

        // Theme Logic
        if(localStorage.getItem('theme') === 'light') document.getElementById('themeToggle').checked = true;
        
        function toggleTheme() {
            if (document.getElementById('themeToggle').checked) {
                document.body.classList.add('light-mode');
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                localStorage.setItem('theme', 'dark');
            }
        }

        // Tab Switch Logic
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // Send OTP Logic
        function sendOTP() {
            const email = document.getElementById('fEmail').value;
            const btn = document.getElementById('otpBtn');
            btn.innerText = "SENDING..."; btn.disabled = true;

            fetch('/send-otp', {
                method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: 'email=' + encodeURIComponent(email)
            }).then(r => r.json()).then(data => {
                if (data.status === 'success') {
                    emailjs.send("service_zvy3re2", "template_voil6wc", { to_email: email, otp: data.otp })
                    .then(() => { Swal.fire({icon:'success', title:'OTP SENT', text:'OTP Sent to your email.', background: 'rgba(0, 24, 40, 0.95)', color: '#00ff00', confirmButtonColor: '#00ff00'}); btn.innerText = "SENT ✅"; })
                    .catch(() => { Swal.fire({icon:'error', title:'ERROR', text:'Email Service Error.', background: 'rgba(0, 24, 40, 0.95)', color: '#ff003c', confirmButtonColor: '#ff003c'}); btn.innerText = "GET OTP"; btn.disabled = false; });
                }
            });
        }

        // Verify OTP Logic
        function verifyOTPBeforeReset() {
            const email = document.getElementById('fEmail').value;
            const otp = document.getElementById('otp_input_forgot').value;
            const vBtn = document.getElementById('vBtn');

            if (!otp) {
                Swal.fire({ icon: 'warning', text: 'Please enter the OTP first!', background: 'rgba(0, 24, 40, 0.95)', color: '#00f3ff', confirmButtonColor: '#00f3ff' });
                return;
            }

            fetch('/verify-register-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'email=' + encodeURIComponent(email) + '&otp=' + encodeURIComponent(otp)
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') {
                    Swal.fire({ icon: 'success', title: 'VERIFIED', text: 'OTP Verified! The reset button is now unlocked.', background: 'rgba(0, 24, 40, 0.95)', color: '#00ff00', confirmButtonColor: '#00ff00' });
                    const resetBtn = document.getElementById('submitPassBtn');
                    resetBtn.disabled = false;
                    resetBtn.style.opacity = "1";
                    resetBtn.style.cursor = "pointer";
                    resetBtn.classList.add("btn-active"); // Custom hover class logic handled by CSS
                    
                    vBtn.innerText = "VERIFIED ✅";
                    vBtn.style.color = "#000";
                    vBtn.style.background = "#00ff00";
                    vBtn.style.borderColor = "#00ff00";
                    vBtn.style.boxShadow = "0 0 15px #00ff00";
                    vBtn.disabled = true;
                } else {
                    Swal.fire({ icon: 'error', title: 'ACCESS DENIED', text: 'Wrong OTP!', background: 'rgba(0, 24, 40, 0.95)', color: '#ff003c', confirmButtonColor: '#ff003c' });
                }
            });
        }
    </script>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <script>
            Swal.fire({ 
                icon: '{{ messages[0][0] }}' === 'error' ? 'error' : 'success', 
                title: '{{ messages[0][0] }}' === 'error' ? 'SYSTEM ERROR' : 'SUCCESS',
                text: '{{ messages[0][1] }}', 
                background: 'rgba(0, 24, 40, 0.95)', 
                color: '{{ messages[0][0] }}' === 'error' ? '#ff003c' : '#00ff00',
                confirmButtonColor: '{{ messages[0][0] }}' === 'error' ? '#ff003c' : '#00ff00'
            });
        </script>
      {% endif %}
    {% endwith %}
</body>
</html>
