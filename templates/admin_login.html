<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Premium Admin Login</title>
    <style>
        body {
            background-color: #0f172a; /* Deep dark background */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #1e293b;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            width: 350px;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 25px;
            font-weight: 600;
        }
        /* Premium Flashed Messages Styling */
        .messages {
            background: rgba(239, 68, 68, 0.1);
            border-left: 4px solid #ef4444;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 4px;
            color: #f87171;
            font-size: 14px;
            text-align: center;
        }
        .messages p { margin: 5px 0; font-weight: bold; }

        label {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 10px;
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #38bdf8;
        }
        /* 3D Button Animation - Admin Red */
        button {
            width: 100%;
            padding: 14px;
            background: #ef4444; /* Admin Red */
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 5px 0 #b91c1c;
            transition: all 0.1s;
        }
        button:hover {
            background: #f87171;
        }
        button:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #b91c1c;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h2>🛡️ Login</h2>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="messages">
        {% for message in messages %}
          <p>⚠️ {{ message }}</p>
        {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="/admin/login" autocomplete="off">
        <label>Username:</label>
        <input type="text" name="username" placeholder="Enter Username (admin/teacher)" autocomplete="off" required>
        
        <label>Password:</label>
        <input type="password" name="password" placeholder="Enter Password" autocomplete="new-password" required>
        
        <button type="submit">Login to Panel</button>
    </form>
</div>
</body>
</html>
