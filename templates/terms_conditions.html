<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms and Conditions</title>
    <style>
        body {
            background-color: black;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            transform: perspective(800px) rotateX(15deg);
            width: 80%;
            max-width: 800px;
            background: rgba(0, 20, 0, 0.8);
            padding: 40px;
            border: 2px solid #0f0;
            box-shadow: 0 0 25px #0f0;
            text-shadow: 0 0 5px #0f0;
            overflow-y: auto; /* Agar text bada ho toh scroll ho jaye */
            max-height: 80vh;
        }

        h1 {
            text-align: center;
            font-weight: bold;
            border-bottom: 2px dashed #0f0;
            padding-bottom: 10px;
        }

        #typing-text {
            font-weight: bold;
            white-space: pre-wrap;
            font-size: 1rem;
            line-height: 1.5;
        }

        .cursor {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .action-buttons {
            margin-top: 20px;
            display: none;
        }

        .btn {
            background-color: black;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
            text-shadow: 0 0 5px #0f0;
            box-shadow: 0 0 10px #0f0;
        }

        .btn:hover {
            background-color: #0f0;
            color: black;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DATA PRIVACY CONDITIONS_</h1>
        <div id="typing-text"></div><span class="cursor">|</span>
        
        <div class="action-buttons" id="action-buttons">
            <button class="btn" id="accept-btn">[Y] ACCEPT</button>
            <button class="btn" id="decline-btn">[N] DECLINE</button>
        </div>
    </div>

    <script>
        const textToType = `INITIALIZING SYSTEM...
[+] SECURE CONNECTION ESTABLISHED.

=== 🔐 DATA & TERMS POLICY ===

1. Data Usage
This system collects and stores user data such as student information, facial data, and attendance records strictly for educational and attendance purposes only.

2. Data Security
We apply basic security measures to protect stored data. However, no digital system is 100% secure, and risks such as data loss, unauthorized access, or hacking may still occur.

3. User Responsibility
Users (teachers/admins) are responsible for:
- Keeping login credentials safe
- Not sharing sensitive information with others
- Using the system only for authorized purposes

4. Limitation of Responsibility
In case of any data loss, deletion, or unauthorized access (including hacking), the Developer and Admin will not be held fully responsible for such incidents, especially if caused by user negligence, external attacks, or misuse of the system.

5. Do Not Share Your Details
Users are strictly advised:
- DO NOT SHARE your login details, passwords, or any sensitive information with anyone.
- Any misuse due to sharing of credentials will be the user's own responsibility.

6. Data Handling
All data should be handled carefully and used only within the educational environment. Unauthorized sharing or misuse of data is strictly prohibited.

7. Policy Updates
This policy may be updated or modified at any time without prior notice.

DO YOU ACCEPT THE TERMS AND CONDITIONS?_`;

        const textElement = document.getElementById("typing-text");
        const actionButtons = document.getElementById("action-buttons");
        let index = 0;

        function typeText() {
            if (index < textToType.length) {
                textElement.innerHTML += textToType.charAt(index);
                index++;
                setTimeout(typeText, 10); // Speed 10ms
            } else {
                actionButtons.style.display = "block";
            }
        }

        window.onload = typeText;

        // ✅ Button Actions (Redirecting to Main Sci-Fi Portal Login)
        document.getElementById("accept-btn").onclick = function() {
            window.location.href = "{{ url_for('home') }}";
        };

        document.getElementById("decline-btn").onclick = function() {
            alert("You must accept the terms to proceed.");
        };
    </script>

</body>
</html>
