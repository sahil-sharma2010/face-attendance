<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 250px; background: #1e293b; padding: 20px 0; border-right: 1px solid #334155; display: flex; flex-direction: column; }
        .sidebar h3 { text-align: center; color: #38bdf8; margin-bottom: 30px; font-size: 20px; }
        .sidebar a { text-decoration: none; color: #cbd5e1; padding: 15px 25px; margin: 5px 15px; border-radius: 8px; font-weight: bold; transition: 0.2s; }
        .sidebar a:hover { background: rgba(56, 189, 248, 0.1); color: white; transform: translateX(5px); }

        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .header-title { font-size: 28px; color: #38bdf8; margin-bottom: 30px; border-bottom: 2px solid #334155; padding-bottom: 10px;}
        
        .form-card { background: #1e293b; padding: 30px; border-radius: 15px; border: 1px solid #334155; max-width: 500px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        label { color: #94a3b8; font-weight: bold; font-size: 13px; display: block; margin-top: 15px; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        input:focus { border-color: #38bdf8; }
        
        .save-btn { width: 100%; padding: 14px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 25px; cursor: pointer; box-shadow: 0 5px 0 #047857; transition: 0.1s;}
        .save-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #047857; }
        .cancel-btn { display: block; text-align: center; margin-top: 15px; color: #ef4444; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>👨‍🏫 Teacher Portal</h3>
        <a href="/teacher/dashboard">Dashboard</a>
        <a href="/teacher/profile" style="background: #38bdf8; color: #0f172a;">Personal Info</a>
        <a href="/teacher/settings">Settings</a>
    </div>

    <div class="main-content">
        <h1 class="header-title">✏️ Edit Personal Information</h1>
        
        <div class="form-card">
            <form action="/teacher/edit_profile" method="POST">
                <label>Full Name:</label>
                <input type="text" name="name" value="{{ teacher.name }}" required>
                
                <label>Mobile Number:</label>
                <input type="text" name="mobile" value="{{ teacher.mobile }}" required>
                
                <label>Lecture Name (Subject):</label>
                <input type="text" name="subject" value="{{ teacher.subject }}" required>
                
                <label>Class Time (Start):</label>
                <input type="time" name="class_time" value="{{ teacher.class_time }}" required>
                
                <button type="submit" class="save-btn">💾 Save Changes</button>
                <a href="/teacher/profile" class="cancel-btn">❌ Cancel</a>
            </form>
        </div>
    </div>

</body>
</html>
